apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-dashboard}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-dashboard}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-dashboard, guardian-component: dashboard}
    spec:
      serviceAccountName: {{ .Release.Name }}-dashboard
      automountServiceAccountToken: false
      securityContext: {{- include "guardian.security" . | nindent 8 }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "guardian.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "guardian.containerSecurity" . | nindent 12 }}
          resources: {{ toYaml .Values.resources.dashboard | nindent 12 }}
          command: [streamlit, run, frontend/main.py, --server.address, 0.0.0.0, --server.port, "8501", --server.headless, "true", --browser.gatherUsageStats, "false"]
          env:
            - {name: BACKEND_URL, value: "http://{{ .Release.Name }}-backend:8000"}
            - {name: HOME, value: /tmp}
          ports: [{name: http, containerPort: 8501}]
          readinessProbe: {httpGet: {path: /_stcore/health, port: http}, initialDelaySeconds: 5}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 128Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-dashboard}
spec:
  selector: {app: {{ .Release.Name }}-dashboard}
  ports: [{name: http, port: 8501, targetPort: http}]
