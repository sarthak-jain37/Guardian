{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-internal}
spec:
  podSelector:
    matchExpressions: [{key: guardian-component, operator: Exists}]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions: [{key: guardian-component, operator: Exists}]
{{- end }}
