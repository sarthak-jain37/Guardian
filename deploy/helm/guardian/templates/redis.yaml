apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-redis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}-redis}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-redis, guardian-component: redis}
    spec:
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      automountServiceAccountToken: false
      securityContext: {runAsUser: 999, runAsGroup: 999, fsGroup: 999, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: {{ .Values.redisImage | quote }}
          securityContext: {{- include "guardian.containerSecurity" . | nindent 12 }}
          args: [redis-server, --appendonly, "yes", --dir, /data]
          ports: [{name: redis, containerPort: 6379}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: "1", memory: 512Mi}}
          readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 3}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: {{ .Release.Name }}-redis}}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-redis}
spec:
  selector: {app: {{ .Release.Name }}-redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
