# Opt-in example ONLY. Select a test workload; this changes egress policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: guardian-http-visibility
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      guardian-http-visibility: "enabled"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "8080"
              protocol: TCP
          rules:
            http: [{}]
