# Observe only. Validate hook availability against the customer's kernel.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: guardian-sensitive-files
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/run/secrets/
                - /run/secrets/
                - /etc/shadow
                - /etc/kubernetes/
                - /root/.ssh/
                - /var/run/docker.sock
                - /run/containerd/
                - /proc/kcore
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: guardian-runtime-operations
spec:
  kprobes:
    - call: sys_setns
      syscall: true
      return: true
      args:
        - index: 1
          type: int
      returnArg:
        index: 0
        type: int
    - call: sys_unshare
      syscall: true
      return: true
      args:
        - index: 0
          type: int
      returnArg:
        index: 0
        type: int
    - call: sys_mount
      syscall: true
      return: true
      returnArg:
        index: 0
        type: int
    - call: sys_ptrace
      syscall: true
      return: true
      args:
        - index: 0
          type: int
      returnArg:
        index: 0
        type: int
    - call: sys_bpf
      syscall: true
      return: true
      args:
        - index: 0
          type: int
      returnArg:
        index: 0
        type: int
